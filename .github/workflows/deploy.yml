name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/world-monitor-energy-dashboard-5FN5X
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Fetch latest news from GDELT
        run: python3 scripts/fetch-news.py
        continue-on-error: true

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
