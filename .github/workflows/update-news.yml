name: Update News Cache

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分に実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: claude/world-monitor-energy-dashboard-5FN5X
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch news from GDELT / RSS
        run: python3 scripts/fetch-news.py
        continue-on-error: true

      - name: Fetch commodity prices from Yahoo Finance
        run: python3 scripts/fetch-prices.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/news-energy.json frontend/public/news-global.json frontend/public/prices-cache.json
          git diff --staged --quiet || (
            git commit -m "chore: ニュースキャッシュ更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          )
